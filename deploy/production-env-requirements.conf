# Data-only contract for the production EnvironmentFile. This file is parsed
# as data by production-env-preflight.sh and is never sourced or evaluated.
format_version=1

# Required entries only assert that the variable exists and is non-empty.
required=SECOND_BRAIN_VAULT_PATH
required=SECOND_BRAIN_GITHUB_CLIENT_ID
required=SECOND_BRAIN_GITHUB_CLIENT_SECRET
required=SECOND_BRAIN_SESSION_SECRET

# Fixed entries also assert presence. Values here must remain non-secret.
fixed=SECOND_BRAIN_VAULT_OPERATION_LOCK_PATH=/srv/second-brain/runtime/vault-sync.lock
fixed=SECOND_BRAIN_WEB_AUTH=github
fixed=SECOND_BRAIN_PUBLIC_BASE_URL=https://brain.mikemoore.top
fixed=SECOND_BRAIN_GITHUB_ALLOWED_USER_ID=42142321
fixed=SECOND_BRAIN_SESSION_TTL_SECONDS=43200
fixed=SECOND_BRAIN_OAUTH_STATE_TTL_SECONDS=600

# These settings are allowed for an explicitly enabled advisor/LLM path but
# are not required by the ordinary Web deployment.
optional=CLOUDFLARE_ACCOUNT_ID
optional=CLOUDFLARE_API_TOKEN
optional=SECOND_BRAIN_ACTION_GITHUB_ENABLED
optional=SECOND_BRAIN_ACTION_GITHUB_TOKEN
optional=SECOND_BRAIN_ACTION_GITHUB_REPOSITORIES
