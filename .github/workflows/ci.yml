name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep third-party actions on reviewed immutable commits; comments identify the
# human-readable upstream release that supplied each pin.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Check formatting
        run: uv run --python 3.14 ruff format --check .
      - name: Lint
        run: uv run --python 3.14 ruff check .
      - name: Type check
        run: uv run --python 3.14 mypy src tests
      - name: Test
        run: uv run --python 3.14 pytest

  windows-ssl-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Test Windows SSL and research process regressions
        run: >-
          uv run --python 3.14 pytest
          tests/test_cloudflare_workers_ai.py::test_windows_sanitized_environment_initializes_ssl_in_real_isolated_child
          tests/test_jina_reader.py::test_windows_sanitized_research_environment_initializes_ssl_in_real_isolated_child
          tests/test_jina_reader.py::test_windows_sanitized_research_environment_runs_curl_version_without_network

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build
