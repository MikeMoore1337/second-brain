name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} ruff format --check .
      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy src tests
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest
