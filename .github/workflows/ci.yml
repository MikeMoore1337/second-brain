name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Check formatting
        run: uv run --python 3.14 ruff format --check .
      - name: Lint
        run: uv run --python 3.14 ruff check .
      - name: Type check
        run: uv run --python 3.14 mypy src tests
      - name: Test
        run: uv run --python 3.14 pytest

  windows-ssl-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Test Windows SSL and research process regressions
        run: >-
          uv run --python 3.14 pytest
          tests/test_cloudflare_workers_ai.py::test_windows_sanitized_environment_initializes_ssl_in_real_isolated_child
          tests/test_jina_reader.py::test_windows_sanitized_research_environment_initializes_ssl_in_real_isolated_child
          tests/test_jina_reader.py::test_windows_sanitized_research_environment_runs_curl_version_without_network

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build
