name: Temporary Issue 401 npm lock regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-401-temporary.yml

permissions:
  contents: read

jobs:
  regenerate-dev-lock:
    if: github.head_ref == 'fix/401-npm-dev-advisories'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Native npm security repair (no package scripts)
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress
      - name: Run all-dependencies audit and frontend regression
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run check
          npm run build
          npm run qa:pwa
      - name: Validate native lock and emit bounded patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const before = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:web/package-lock.json'], {encoding: 'utf8'}));
          const afterText = fs.readFileSync('package-lock.json','utf8');
          const after = JSON.parse(afterText);
          const required = new Map([
            ['node_modules/brace-expansion', '5.0.12'],
            ['node_modules/filelist/node_modules/brace-expansion', '2.1.7'],
            ['node_modules/fast-uri', '3.1.8'],
            ['node_modules/serialize-javascript', '7.1.2'],
            ['node_modules/source-map-js', '1.2.2']
          ]);
          for (const [key,min] of required) {
            const v = after.packages[key]?.version;
            if (!v) throw Error('MISSING_TARGET: ' + key);
            const toParts = s => s.split('.').map(Number);
            const a=toParts(v), b=toParts(min);
            if (a[0] !== b[0] || a.some((n,i) => i===0 ? false : (i===1 ? n < b[i] : a[1]===b[1] && n < b[i]))) {
              throw Error('UNPATCHED: ' + key+' '+v);
            }
          }
          const updates=[];
          for (const path of new Set([...Object.keys(before.packages), ...Object.keys(after.packages)])) {
            const b=before.packages[path]?.version??null, a=after.packages[path]?.version??null;
            if (a!==b) updates.push({path,from:b,to:a});
          }
          if (!updates.length || updates.length > 35) throw Error('UNEXPECTED_UPDATE_COUNT ' + updates.length);
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if (changed.length!==1 || changed[0]!=='web/package-lock.json') throw Error('UNEXPECTED_CHANGED_FILES '+JSON.stringify(changed));
          const patch=cp.execFileSync('git',['diff','--no-ext-diff','--unified=3','--','package-lock.json'],{encoding:'utf8',maxBuffer:500000});
          if (patch.length<50 || patch.length>200000) throw Error('BAD_PATCH_SIZE '+patch.length);
          console.log('SB401_PACKAGE_UPDATES:'+JSON.stringify(updates));
          console.log('SB401_LOCK_SHA256='+crypto.createHash('sha256').update(afterText).digest('hex'));
          console.log('SB401_PATCH_LENGTH='+patch.length);
          for(let i=0;i<patch.length;i+=1300)console.log('SB401_PATCH_CHUNK:'+JSON.stringify(patch.slice(i,i+1300)));
          console.log('SB401_PATCH_COMPLETE');
          NODE
