[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "0.1.0"
description = "Открытое Markdown-first ядро автоматизации личной базы знаний"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mike Moore" }]
dependencies = [
  "markdown-it-py>=4.0,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "ruamel-yaml>=0.18,<0.19",
  "typer>=0.16,<1",
]

[project.scripts]
second-brain = "second_brain.entrypoints.cli.app:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
extend-ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
